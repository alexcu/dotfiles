session_name: scratch
start_directory: '${HOME}'
global_options:
  automatic-rename: off
options:
  base-index: 0

windows:
  # Home (:0)
  - window_name: 🏠 Home
    focus: true
    options:
      "@start_directory": ${HOME}
    environment:
      START_DIR: ${HOME}
    panes:
      # Home (:0.1)
      - focus: true
        shell_command:
          - tip! scratch:0.1 '🏠 Home' && cds

  - window_name: 🪄 Prompts
    focus: false
    options:
      "@start_directory": ${HOME_REPOS}/personal/prompts
    environment:
      START_DIR: ${HOME_REPOS}/personal/prompts
    panes:
      - focus: true
        shell_command:
          - tip! scratch:1.1 '🪄 Prompts' && cds

  # Repos (:2)
  - window_name: 📦 Repos
    focus: false
    options:
      "@start_directory": ${HOME_REPOS}/personal
    environment:
      START_DIR: ${HOME_REPOS}/personal
    panes:
      - focus: true
        shell_command:
          - tip! scratch:2.1 '📦 Repos' && cds

  - window_name: 🛫 Flightscan
    focus: false
    options:
      "@start_directory": ${HOME_REPOS}/personal/flightscan
    environment:
      START_DIR: ${HOME_REPOS}/personal/flightscan
    panes:
      - focus: true
        shell_command:
          - tip! scratch:3.1 '🛫 Flightscan' && cds
          - cmd: ./bin/start
            enter: false

  # Utils (:4)
  - window_name: 🧰 Utils
    focus: false
    layout: main-horizontal
    options:
      main-pane-height: 75%
      "@start_directory": ${HOME}
    panes:
      # ncdu (:4.1)
      - focus: true
        shell_command:
          - tip! scratch:4.2 '🧹 ncdu' && cds
          - ncdu
      # htop (:4.2)
      - shell_command:
          - tip! scratch:4.1 '🧪 htop' && cds
          - htop

  # Hipposerve (:5)
  - window_name: 🦛 Hipposerve
    focus: false
    options:
      "@start_directory": ${HOME}
    panes:
      - focus: true
        shell_command:
          - tip! scratch:5.1 '🦛 Hipposerve' && cds
          - ssh hipposerve
